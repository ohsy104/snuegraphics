<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 세계 기후 탐험대</title>

  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    :root{
      --header-green: #1e8f3e;
      --light-lime: #dff9d8;
      --card-white: #ffffff;
      --correct-green: #9ce29a;
      --wrong-red: #ff8a8a;
      --uncertain-orange: #ffd085;
      --text-dark: #113017;
      --box-radius: 10px;
      --gap: 16px;
    }
    *{box-sizing: border-box; font-family: 'Noto Sans KR', Arial, sans-serif;}
    body{
      margin:0;
      background:#f6f8f6;
      color:var(--text-dark);
      padding:20px;
    }

    .header{
      background:var(--header-green);
      color:white;
      padding:28px 20px;
      border-radius:var(--box-radius);
      text-align:center;
      font-size:28px;
      font-weight:700;
      margin-bottom:var(--gap);
    }

    .main{
      display:flex;
      gap:var(--gap);
      align-items:flex-start;
    }
    .col{
      flex:1;
      min-width:0;
    }

    .panel{
      background:var(--light-lime);
      padding:14px;
      border-radius:var(--box-radius);
      margin-bottom:var(--gap);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .card{
      background:var(--card-white);
      padding:12px;
      border-radius:8px;
      min-height:120px;
    }

    .upload-area{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .file-input{
      display:flex;
      gap:8px;
      align-items:center;
    }
    input[type="file"]{display:none;}
    .btn{
      background:var(--header-green);
      color:white;
      border:none;
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
    }
    .img-preview{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px;
      border-radius:8px;
      background:#fff;
      min-height:140px;
      transition:background .15s, outline .15s;
    }
    .img-preview.dragover{
      outline:3px dashed #3b9cff;
      background: #f0fbff;
    }
    .img-preview img{
      max-width:25vw;
      max-height:40vh;
      width:auto;
      height:auto;
      border-radius:6px;
      object-fit:cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .matrix-grid{
      display:grid;
      grid-template-columns: repeat(4,1fr);
      gap:6px;
      margin-top:8px;
    }
    .matrix-cell{
      padding:10px;
      border-radius:6px;
      text-align:center;
      font-weight:700;
      min-height:56px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .stats-row{
      display:flex;
      gap:14px;
      margin-top:12px;
      align-items:center;
    }
    .stat{
      background:#fff;
      padding:12px;
      border-radius:8px;
      flex:1;
      text-align:center;
    }

    .gallery{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:8px;
    }
    .thumb{
      background:#fff;
      padding:6px;
      border-radius:8px;
      width:140px;
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:center;
    }
    .thumb img{max-width:120px; max-height:90px; object-fit:cover; border-radius:6px;}
    .thumb .meta{font-size:12px; text-align:center; color:#223; word-break:break-all;}

    @media (max-width:900px){
      .main{flex-direction:column;}
      .img-preview img{max-width:50vw;}
    }
  </style>
</head>
<body>
  <div class="header">AI 세계 기후 탐험대</div>

  <div class="main">
    <div class="col">
      <div class="panel">
        <div class="card upload-area">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-weight:700;">이미지 업로드</div>
            <div style="font-size:13px;color:#2b5a2b;">모델: Teachable Machine</div>
          </div>

          <div class="file-input">
            <label class="btn" for="filePicker">사진 선택</label>
            <input id="filePicker" type="file" accept="image/*" />
            <button class="btn" id="predictBtn" style="background:#3b9cff;">예측하기</button>
          </div>

          <div style="display:flex;gap:8px;align-items:center;">
            <label>실제 레이블:</label>
            <select id="actualLabelSelect"></select>
            <label style="margin-left:8px;font-size:12px;color:#345;">(업로드시 선택)</label>
          </div>

          <div class="img-preview" id="imgPreview" title="이미지를 여기로 드래그하거나 붙여넣기(Paste) 하세요">
            <div style="color:#789">이미지를 업로드하면 미리보기가 여기에 표시됩니다. (드래그 앤 드롭 지원)</div>
          </div>

          <div id="predictionResult" style="margin-top:6px;font-weight:600;"></div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="panel">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-weight:700;">혼동행렬 (실제:행, 예측:열)</div>
            <div style="font-size:13px;color:#4a6b4a;">불확실: 신뢰도 75% 미만</div>
          </div>

          <div id="matrixContainer" class="matrix-grid" aria-hidden="false"></div>

          <div class="stats-row">
            <div class="stat">
              전체: <span id="totalCount">0</span>
            </div>
            <div class="stat">
              정답: <span id="correctCount">0</span>
            </div>
            <div class="stat">
              정확도: <span id="accuracyPct">0%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-weight:700;">오답 갤러리</div>
            <div style="font-size:13px;color:#4a6b4a;">(파일명 — 예측, 실제)</div>
          </div>

          <div id="gallery" class="gallery" style="margin-top:8px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TM_URL = "https://teachablemachine.withgoogle.com/models/4E3fH9sQf/";
    const MODEL_URL = TM_URL + "model.json";
    const METADATA_URL = TM_URL + "metadata.json";
    const UNCERTAIN_LABEL = "불확실";
    const THRESHOLD = 0.75;

    let model, maxPredictions;
    let classLabels = [];
    let matrix;
    let counts = { total:0, correct:0 };
    const storageKey = "snuegraphics_wrong_gallery_v1";

    async function initModel(){
      try{
        if(typeof tmImage === 'undefined'){
          throw new Error('Teachable Machine 라이브러리 로드 실패 (tmImage 정의 안됨)');
        }
        model = await tmImage.load(MODEL_URL, METADATA_URL);
        maxPredictions = model.getTotalClasses();
        classLabels = model.getClassLabels();
        setupUI();
      }catch(e){
        alert("모델 로드 실패: " + e.message + "\n모델 URL을 확인하세요.");
        console.error(e);
      }
    }

    function setupUI(){
      const sel = document.getElementById("actualLabelSelect");
      sel.innerHTML = "";
      classLabels.forEach((l) => {
        const opt = document.createElement("option");
        opt.value = l;
        opt.textContent = l;
        sel.appendChild(opt);
      });

      const n = classLabels.length;
      matrix = Array.from({length:n}, () => Array(n+1).fill(0));
      renderMatrix();

      document.getElementById("filePicker").addEventListener("change", handleFile);
      document.getElementById("predictBtn").addEventListener("click", handlePredict);

      const imgPreview = document.getElementById('imgPreview');
      imgPreview.addEventListener('dragover', (e)=>{ e.preventDefault(); imgPreview.classList.add('dragover'); });
      imgPreview.addEventListener('dragleave', (e)=>{ e.preventDefault(); imgPreview.classList.remove('dragover'); });
      imgPreview.addEventListener('drop', (e)=>{ e.preventDefault(); imgPreview.classList.remove('dragover'); handleDrop(e); });
      imgPreview.addEventListener('click', ()=> document.getElementById('filePicker').click());

      document.addEventListener('paste', handlePaste);

      loadGalleryFromStorage();
      updateStatsDisplay();
    }

    function renderMatrix(){
      const container = document.getElementById("matrixContainer");
      container.innerHTML = "";

      const n = classLabels.length;
      const corner = document.createElement("div");
      corner.className = "matrix-cell";
      corner.style.background = "#f5fff0";
      corner.style.fontWeight = "800";
      corner.textContent = "실제 \\ 예측";
      container.appendChild(corner);

      classLabels.forEach(lbl => {
        const c = document.createElement("div");
        c.className = "matrix-cell";
        c.style.background = "#f2fff4";
        c.style.fontWeight = "700";
        c.textContent = lbl;
        container.appendChild(c);
      });

      const uc = document.createElement("div");
      uc.className = "matrix-cell";
      uc.style.background = "#fff7e6";
      uc.style.fontWeight = "700";
      uc.textContent = UNCERTAIN_LABEL;
      container.appendChild(uc);

      classLabels.forEach((actual, rIdx) => {
        const lab = document.createElement("div");
        lab.className = "matrix-cell";
        lab.style.background = "#f2fff4";
        lab.style.fontWeight = "700";
        lab.textContent = actual;
        container.appendChild(lab);

        for(let cIdx=0;cIdx<n+1;cIdx++){
          const cell = document.createElement("div");
          cell.className = "matrix-cell";
          const val = matrix[rIdx][cIdx] || 0;
          cell.dataset.r = rIdx;
          cell.dataset.c = cIdx;
          cell.textContent = val;
          if(cIdx === rIdx){
            cell.style.background = "var(--correct-green)";
            cell.style.color = "#05350d";
          } else if (cIdx === n){
            cell.style.background = "var(--uncertain-orange)";
            cell.style.color = "#4a2b00";
          } else {
            cell.style.background = "var(--wrong-red)";
            cell.style.color = "#3a0000";
          }
          container.appendChild(cell);
        }
      });
    }

    let currentFile = null;
    let currentImageElement = null;
    function handleFile(e){
      const file = e.target.files ? e.target.files[0] : e;
      if(!file) return;
      showPreviewFromFile(file);
    }

    function handleDrop(e){
      const dt = e.dataTransfer;
      if(!dt) return;
      const file = dt.files && dt.files[0];
      if(file) {
        if(!file.type.startsWith('image/')) return alert('이미지 파일만 업로드할 수 있습니다.');
        showPreviewFromFile(file);
      }
    }

    function handlePaste(e){
      const items = (e.clipboardData || window.clipboardData).items;
      if(!items) return;
      for(let i=0;i<items.length;i++){
        const it = items[i];
        if(it.type && it.type.indexOf('image') !== -1){
          const blob = it.getAsFile();
          if(blob) { showPreviewFromFile(blob); e.preventDefault(); break; }
        }
      }
    }

    function showPreviewFromFile(file){
      currentFile = file;
      const imgPreview = document.getElementById("imgPreview");
      imgPreview.innerHTML = "";
      const img = document.createElement("img");
      imgPreview.appendChild(img);
      const reader = new FileReader();
      reader.onload = () => { img.src = reader.result; };
      reader.readAsDataURL(file);
      currentImageElement = img;
      document.getElementById("predictionResult").textContent = "";

      try{
        const fp = document.getElementById('filePicker');
        if(window.DataTransfer){
          const dt = new DataTransfer();
          dt.items.add(file);
          fp.files = dt.files;
        }
      }catch(e){}
    }

    async function handlePredict(){
      if(!model){
        alert("모델이 아직 로드되지 않았습니다.");
        return;
      }
      if(!currentImageElement){
        alert("먼저 이미지를 선택하거나 드롭하세요.");
        return;
      }
      try{
        const predictions = await model.predict(currentImageElement, false);
        predictions.sort((a,b)=>b.probability - a.probability);
        const top = predictions[0];
        const predictedRaw = top.className;
        const prob = top.probability;
        let predictedLabel = predictedRaw;
        if(prob < THRESHOLD){
          predictedLabel = UNCERTAIN_LABEL;
        }

        const actual = document.getElementById("actualLabelSelect").value;
        if(!actual){
          alert("실제 레이블을 선택해 주세요.");
          return;
        }

        const actualIndex = classLabels.indexOf(actual);
        const predictedIndex = (predictedLabel === UNCERTAIN_LABEL) ? classLabels.length : classLabels.indexOf(predictedLabel);
        if(actualIndex < 0){
          console.warn("Actual label not found in classLabels:", actual);
          return;
        }
        matrix[actualIndex][predictedIndex] = (matrix[actualIndex][predictedIndex] || 0) + 1;

        counts.total += 1;
        if(predictedIndex === actualIndex){
          counts.correct += 1;
        } else {
          addToGallery(currentFile, predictedLabel, actual, prob);
        }

        renderMatrix();
        updateStatsDisplay();

        const prText = `예측: ${predictedLabel} (${(prob*100).toFixed(1)}%) — 실제: ${actual}`;
        document.getElementById("predictionResult").textContent = prText;
      }catch(err){
        console.error(err);
        alert("예측 중 오류가 발생했습니다: " + err.message);
      }
    }

    function updateStatsDisplay(){
      document.getElementById("totalCount").textContent = counts.total;
      document.getElementById("correctCount").textContent = counts.correct;
      const pct = counts.total ? Math.round((counts.correct / counts.total)*1000)/10 : 0;
      document.getElementById("accuracyPct").textContent = pct + "%";
    }

    let gallery = [];
    function addToGallery(file, predicted, actual, prob){
      const reader = new FileReader();
      reader.onload = () => {
        const id = "g_" + Date.now() + "_" + Math.floor(Math.random()*9999);
        const item = {
          id,
          name: file.name || ("image_"+id),
          dataUrl: reader.result,
          predicted,
          actual,
          prob
        };
        gallery.unshift(item);
        saveGalleryToStorage();
        renderGallery();
      };
      reader.readAsDataURL(file);
    }

    function renderGallery(){
      const g = document.getElementById("gallery");
      g.innerHTML = "";
      if(gallery.length === 0){
        g.innerHTML = "<div style='color:#667; font-size:13px;'>오답 이미지가 아직 없습니다.</div>";
        return;
      }
      gallery.forEach(item => {
        const t = document.createElement("div");
        t.className = "thumb";
        const img = document.createElement("img");
        img.src = item.dataUrl;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `${item.name}<br/><span style="font-weight:700;color:#b22222">${item.predicted}</span> → <span style="font-weight:700;color:#0b6e2f">${item.actual}</span> ${(item.prob!==undefined) ? `(${Math.round(item.prob*100)}%)` : ""}`;
        const del = document.createElement("button");
        del.textContent = "삭제";
        del.style.marginTop="6px";
        del.style.fontSize="12px";
        del.style.padding="6px";
        del.style.border="none";
        del.style.borderRadius="6px";
        del.style.background="#ffd9d9";
        del.style.cursor="pointer";
        del.onclick = () => { gallery = gallery.filter(x=>x.id!==item.id); saveGalleryToStorage(); renderGallery(); };

        t.appendChild(img);
        t.appendChild(meta);
        t.appendChild(del);
        g.appendChild(t);
      });
    }

    function saveGalleryToStorage(){
      try{
        const toSave = gallery.map(({id,name,dataUrl,predicted,actual,prob}) => ({id,name,dataUrl,predicted,actual,prob}));
        localStorage.setItem(storageKey, JSON.stringify(toSave));
      }catch(e){ console.warn("saveGalleryToStorage failed", e); }
    }
    function loadGalleryFromStorage(){
      try{
        const raw = localStorage.getItem(storageKey);
        if(!raw) { renderGallery(); return; }
        gallery = JSON.parse(raw) || [];
        renderGallery();
      }catch(e){ console.warn("loadGalleryFromStorage failed", e); gallery = []; renderGallery(); }
    }

    initModel();

    window._debug = { modelRef: () => model, classLabels: () => classLabels, matrixRef: () => matrix };
  </script>
</body>
</html>
